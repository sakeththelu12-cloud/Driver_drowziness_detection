<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALERTNESS · Driver Drowsiness Monitor</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
</head>
<body>

<div class="cluster">

  <header class="cluster__header">
    <div class="brand">
      <span class="brand__mark">◈</span>
      <div class="brand__text">
        <span class="brand__title">ALERTNESS</span>
        <span class="brand__subtitle">Driver Monitoring System</span>
      </div>
    </div>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <main class="cluster__body">

    <!-- Windshield / camera panel -->
    <section class="viewport" id="viewport">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>

      <div class="viewport__scanline"></div>

      <div class="viewport__badge" id="stateBadge">
        <span class="viewport__badge-dot"></span>
        <span id="stateLabel">INITIALIZING</span>
      </div>

      <div class="viewport__prompt" id="prompt">
        <p>Camera access required to begin monitoring.</p>
        <button id="startBtn" class="btn">Start Monitoring</button>
      </div>
    </section>

    <!-- Instrument panel -->
    <aside class="panel">

      <div class="gauge-card">
        <svg class="gauge" viewBox="0 0 220 140" id="gaugeSvg">
          <path class="gauge__track" d="M 20 120 A 90 90 0 0 1 200 120" />
          <path class="gauge__fill" id="gaugeFill" d="M 20 120 A 90 90 0 0 1 200 120" />
          <line class="gauge__needle" id="gaugeNeedle" x1="110" y1="120" x2="110" y2="40" />
          <circle class="gauge__hub" cx="110" cy="120" r="7" />
        </svg>
        <div class="gauge-card__reading">
          <span class="gauge-card__value" id="scoreValue">0</span>
          <span class="gauge-card__unit">DROWSINESS INDEX</span>
        </div>
      </div>

      <div class="readout">
        <div class="readout__row">
          <span class="readout__label">Status</span>
          <span class="readout__value" id="statusText">Standby</span>
        </div>
        <div class="readout__row">
          <span class="readout__label">Confidence</span>
          <span class="readout__value" id="confidenceText">—</span>
        </div>
        <div class="readout__row">
          <span class="readout__label">Frame rate</span>
          <span class="readout__value" id="fpsText">—</span>
        </div>
        <div class="readout__row">
          <span class="readout__label">Sustained alert</span>
          <span class="readout__value" id="sustainedText">0.0s</span>
        </div>
      </div>

      <div class="log" id="log">
        <div class="log__title">Event log</div>
        <ul class="log__list" id="logList"></ul>
      </div>

    </aside>

  </main>

  <footer class="cluster__footer">
    Inference runs entirely on-device via TensorFlow.js — no video leaves this browser.
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
